<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Academy — Profile</title>
<link rel="stylesheet" href="app.css?v=3">
<style>
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg,#080f20);color:#edf2fb;min-height:100vh}
.topbar{position:fixed!important;left:245px!important;right:0!important;top:0!important;z-index:30}
.profile-main{margin-left:245px;padding:104px 34px 48px;max-width:1550px}
.profile-header{display:flex;align-items:center;gap:20px;padding:24px 26px;margin-bottom:22px;background:var(--panel,#101c30);border:1px solid var(--line,#263957);border-radius:16px}
.avatar{width:86px;height:86px;flex:0 0 86px;display:grid;place-items:center;border-radius:50%;background:var(--panel2,#14233a);border:2px solid var(--line,#263957);color:#dbe3f0}
.avatar svg{width:46px;height:46px}.identity{min-width:0;flex:1}.identity h1{font-size:27px;margin:0 0 7px}.account-id{font-size:12px;color:#91a2ba}.bio{margin-top:9px;color:#aab7ca;font-size:14px;line-height:1.5}
.edit-link{flex:0 0 auto;text-decoration:none;border:1px solid var(--line,#263957);background:var(--panel2,#14233a);color:#edf2fb;padding:11px 15px;border-radius:9px;font-size:13px;font-weight:700}
.pager{display:flex;align-items:center;justify-content:center;gap:18px;margin:0 auto 20px}.arrow{width:38px;height:38px;border:1px solid var(--line,#263957);border-radius:10px;background:var(--panel,#101c30);color:#eaf0fa;font-size:22px;cursor:pointer}.arrow:disabled{opacity:.35;cursor:default}.page-name{min-width:175px;text-align:center;font-size:16px;font-weight:700}.page-count{display:block;margin-top:4px;font-size:11px;font-weight:400;color:#8292ab}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat,.panel{background:var(--panel,#101c30);border:1px solid var(--line,#263957);border-radius:13px;padding:19px}.stat strong{display:block;font-size:27px;margin-bottom:6px;color:var(--blue,#6d8cff)}.stat span{font-size:12px;color:#93a2b8}.panel h2{font-size:17px;margin:0 0 15px}
.instrument-grid,.entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.instrument,.entry{display:flex;align-items:center;gap:12px;padding:14px;background:var(--panel2,#14233a);border:1px solid var(--line,#263957);border-radius:10px}.instrument-icon{width:38px;height:38px;display:grid;place-items:center;background:var(--ma-accent-soft,#16233b);border-radius:9px;font-size:20px}.instrument small,.entry small{display:block;color:#8fa0b8;font-size:11px;margin-top:4px}.empty{padding:38px 20px;text-align:center;color:#8fa0b8;border:1px dashed var(--line,#263957);border-radius:12px}.empty strong{display:block;color:#e5ecf7;margin-bottom:7px;font-size:15px}.entry-icon{font-size:22px}.note{color:#8191a9;font-size:12px;line-height:1.55;margin-top:16px}
@media(max-width:900px){.profile-main{padding-left:22px;padding-right:22px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.topbar{position:static!important;left:auto!important}.profile-main{margin-left:0;padding:28px 16px}.profile-header{padding:18px;gap:13px;flex-wrap:wrap}.avatar{width:66px;height:66px;flex-basis:66px}.identity h1{font-size:22px}.edit-link{margin-left:79px}.stats{gap:10px}.stat{padding:15px}.stat strong{font-size:23px}}
</style>
</head>
<body data-page="profile">
<aside class="sidebar" aria-label="Music Academy navigation"></aside>
<header class="topbar"></header>
<main class="profile-main">
<section class="profile-header">
<div class="avatar" aria-label="Default profile picture"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.3"/><circle cx="12" cy="9" r="3.1" fill="currentColor"/><path d="M5.8 18.1c.9-2.7 3.1-4.2 6.2-4.2s5.3 1.5 6.2 4.2" fill="currentColor"/></svg></div>
<div class="identity"><h1 id="profileName">Musician</h1><div class="account-id">Account number · Not assigned</div><p class="bio" id="profileBio">Your musical journey, all in one place.</p></div>
<a class="edit-link" href="edit-profile.html">✎ Edit Profile</a>
</section>
<nav class="pager" aria-label="Profile pages"><button class="arrow" id="prev" type="button" aria-label="Previous page">‹</button><div class="page-name"><span id="pageTitle">Overview</span><span class="page-count" id="pageCount">Page 1 of 5</span></div><button class="arrow" id="next" type="button" aria-label="Next page">›</button></nav>
<section id="profileContent" aria-live="polite"></section>
<p class="note">Profile details are currently saved in this browser. Account numbers, cloud profiles, and sharing will be connected when Music Academy accounts are built.</p>
</main>
<script src="shared.js?v=24"></script>
<script>
(function(){
function read(key,fallback){try{return JSON.parse(localStorage.getItem("ma_"+key))||fallback}catch(e){return fallback}}
function safe(value){var node=document.createElement("span");node.textContent=String(value);return node.innerHTML}
document.getElementById("profileName").textContent=read("profile_name","Musician");
document.getElementById("profileBio").textContent=read("profile_bio","Your musical journey, all in one place.");
var xp=Number(read("xp",0))||0,done=read("completed",[]),minutes=Number(read("minutes",0))||0,streak=Number(read("streak",0))||0;
var primary=localStorage.getItem("ma_instrument")||"Tenor Saxophone";
var instruments=read("profile_instruments",[]);
var titles=["Overview","My Music","My Compositions","Achievements","Musical Journey"],page=0;
var area=document.getElementById("profileContent");
function render(){
document.getElementById("pageTitle").textContent=titles[page];
document.getElementById("pageCount").textContent="Page "+(page+1)+" of 5";
document.getElementById("prev").disabled=page===0;document.getElementById("next").disabled=page===4;
if(page===0){
var all=[primary].concat(instruments.filter(function(x){return x!==primary}));
area.innerHTML='<div class="stats"><div class="stat"><strong>'+xp+'</strong><span>Total XP</span></div><div class="stat"><strong>'+done.length+'</strong><span>Lessons completed</span></div><div class="stat"><strong>'+minutes+'</strong><span>Practice minutes</span></div><div class="stat"><strong>'+streak+'</strong><span>Day streak</span></div></div><section class="panel"><h2>My Instruments</h2><div class="instrument-grid">'+all.map(function(x,i){return '<div class="instrument"><span class="instrument-icon">'+(i===0?'🎷':'🎵')+'</span><div><strong>'+safe(x)+'</strong><small>'+(i===0?'Primary instrument':'Instrument')+'</small></div></div>'}).join('')+'</div><p class="note">Add, remove, and organize instruments from Edit Profile.</p></section>';
}else if(page===1){
var music=read("profile_music",[]);area.innerHTML='<section class="panel"><h2>My Music</h2>'+(music.length?'<div class="entries">'+music.map(function(x){return '<div class="entry"><span class="entry-icon">🎼</span><div><strong>'+safe(x.title||x.name||'Untitled piece')+'</strong><small>'+safe(x.type||'Music')+'</small></div></div>'}).join('')+'</div>':'<div class="empty"><strong>Your music will show up here</strong>Recordings, performances, and pieces you have played can be featured here.</div>')+'</section>';
}else if(page===2){
var pieces=read("compositions",[]);area.innerHTML='<section class="panel"><h2>My Compositions</h2>'+(pieces.length?'<div class="entries">'+pieces.map(function(x){return '<div class="entry"><span class="entry-icon">🎹</span><div><strong>'+safe(x.title||'Untitled composition')+'</strong><small>'+(Number(x.tempo)||100)+' BPM</small></div></div>'}).join('')+'</div>':'<div class="empty"><strong>No compositions yet</strong>Pieces you create in Composition Studio will appear here.</div>')+'</section>';
}else if(page===3){
var achievements=read("profile_achievements",[]);area.innerHTML='<section class="panel"><h2>Achievements</h2>'+(achievements.length?'<div class="entries">'+achievements.map(function(x){return '<div class="entry"><span class="entry-icon">🏅</span><div><strong>'+safe(x.title||x)+'</strong><small>'+safe(x.description||'Achievement')+'</small></div></div>'}).join('')+'</div>':'<div class="empty"><strong>Your achievements will appear here</strong>Milestones, badges, and personal bests will be collected here.</div>')+'</section>';
}else{
area.innerHTML='<section class="panel"><h2>Musical Journey</h2><div class="entries"><div class="entry"><span class="entry-icon">🎯</span><div><strong>Current focus</strong><small>'+safe(primary)+'</small></div></div><div class="entry"><span class="entry-icon">📚</span><div><strong>'+done.length+' lessons completed</strong><small>Learning progress recorded in this browser</small></div></div><div class="entry"><span class="entry-icon">⏱️</span><div><strong>'+minutes+' practice minutes</strong><small>Time spent building your skills</small></div></div></div><div class="empty" style="margin-top:14px"><strong>Your story is still being written</strong>Your goals and milestones will grow here.</div></section>';
}}
document.getElementById("prev").addEventListener("click",function(){if(page>0){page--;render()}});
document.getElementById("next").addEventListener("click",function(){if(page<4){page++;render()}});
render();
})();
</script>
</body></html>
